name: Financial safety
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: autoflow_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: autoflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://autoflow_test:test-only-password@localhost:5432/autoflow_test
      REFERRAL_TEST_DATABASE_URL: postgresql://autoflow_test:test-only-password@localhost:5432/autoflow_test
      BOT_TOKEN: ""
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements-dev.txt
      - name: Private photo authorization, limits and migration safety
        run: python -m pytest -q tests/test_private_chat_photos.py
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - run: node --test webapp/tests/*.test.cjs
      - name: Install isolated browser regression runtime
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Private chat photos, signed participants and real isolated PostgreSQL
        run: python -m pytest -q -s tests/test_chat_media_browser_postgres.py
        working-directory: backend
        env:
          RUN_CHAT_BROWSER: '1'
      - name: Account purchase, private credentials and shared settlement (isolated PostgreSQL)
        run: python -m pytest -q -s tests/test_account_browser_postgres.py
        working-directory: backend
        env:
          RUN_ACCOUNT_BROWSER: '1'
      - name: Account form, video upload transport, publication consent and popup cleanup (fixtures only)
        run: node webapp/tests/account-module-browser.cjs
      - name: Car detail reference, gallery, seller context, actions and nested Back history (fixtures only)
        run: node webapp/tests/listing-detail-browser.cjs
      - name: Install real media encoder for video playback verification
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Private volume video, signed buyer, real decoding, seeking and 2x/5x playback
        run: python -m pytest -q -s tests/test_account_video_browser.py tests/test_account_video_postgres.py tests/test_account_video_processing.py tests/test_account_video_cleanup_postgres.py tests/test_account_seller_browser_postgres.py
        working-directory: backend
        env:
          RUN_ACCOUNT_VIDEO_BROWSER: '1'
          RUN_ACCOUNT_VIDEO_BENCHMARK: '1'
          RUN_ACCOUNT_BROWSER: '1'
      - name: VIP renewal and mobile keyboard regression (fixtures only)
        run: node webapp/tests/vip-renewal-keyboard-browser.cjs
      - name: Independent game filters and unique badges on mobile layouts (fixtures only)
        run: node webapp/tests/catalog-game-filters-browser.cjs
      - name: Profile reference layout, existing actions and safe mobile navigation (fixtures only)
        run: node webapp/tests/profile-reference-browser.cjs
      - name: Referral references, confirmed rewards, native share and mobile modal lifecycle (fixtures only)
        run: node webapp/tests/referral-reference-browser.cjs
      - name: Repeated navigation, request limits and outage recovery with 50 to 500 listings (fixtures only)
        run: node webapp/tests/catalog-navigation-browser.cjs
      - name: Navigation races, populated sections, resume and withdrawal help (fixtures only)
        run: node webapp/tests/navigation-resilience-browser.cjs
      - name: Automatic withdrawal quote and separate feedback admin UI (fixtures only)
        run: node webapp/tests/feedback-withdrawal-browser.cjs
      - name: Seller references, confirmation protection and owner finance (fixtures only)
        run: |
          node webapp/tests/seller-reference-browser.cjs
          node webapp/tests/deal-lifecycle-browser.cjs
          node webapp/tests/owner-finance-browser.cjs
      - name: Real publication UI, signed API and isolated PostgreSQL (no payments)
        run: python -m pytest -q -s tests/test_publication_browser_postgres.py
        working-directory: backend
        env:
          RUN_PUBLICATION_BROWSER: '1'
      - name: Publication browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-browser-evidence
          path: webapp/tests/evidence/
          if-no-files-found: ignore
      - name: Photo retry, VIP frame and help flows (fixtures only)
        run: node webapp/tests/media-help-browser.cjs
      - name: Single VIP card outline and identical photo rendering (fixtures only)
        run: node webapp/tests/vip-card-outline-browser.cjs
      - name: Partial manual gifts, retries and final confirmation (fixtures only)
        run: node webapp/tests/manual-gift-withdrawal-browser.cjs
      - run: python backend/scripts/build_webapp.py
      - run: git diff --exit-code -- webapp/index.html webapp/build-info.json
  production-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image without publishing or deploying
        run: docker build --tag autoflow-account-video-ci .
      - name: Verify real encoder and Python modules inside production image
        run: docker run --rm --entrypoint sh autoflow-account-video-ci -c 'ffmpeg -version >/dev/null && ffprobe -version >/dev/null && python -m compileall -q /app/backend/app'
