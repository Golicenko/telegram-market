name: Financial safety
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: autoflow_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: autoflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://autoflow_test:test-only-password@localhost:5432/autoflow_test
      REFERRAL_TEST_DATABASE_URL: postgresql://autoflow_test:test-only-password@localhost:5432/autoflow_test
      BOT_TOKEN: ""
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: node --test webapp/tests/*.test.cjs
      - name: Install isolated browser regression runtime
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: VIP renewal and mobile keyboard regression (fixtures only)
        run: node webapp/tests/vip-renewal-keyboard-browser.cjs
      - run: python backend/scripts/build_webapp.py
      - run: git diff --exit-code -- webapp/index.html webapp/build-info.json
